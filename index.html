<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Code — entraînement</title>
<style>
  :root{--bg:#0f1115;--card:#171a21;--txt:#e8eaf0;--dim:#9aa3b2;--ok:#22c55e;--ko:#ef4444;--acc:#3b82f6}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--txt);padding:16px;padding-bottom:80px}
  h1{font-size:20px;margin:0 0 4px}
  .sub{color:var(--dim);font-size:13px;margin-bottom:16px}
  .card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:12px}
  button{font:inherit;border:0;border-radius:10px;padding:12px 14px;background:#242a35;color:var(--txt);width:100%;text-align:left;margin-bottom:8px;cursor:pointer}
  button:active{transform:scale(.99)}
  .primary{background:var(--acc);color:#fff;text-align:center;font-weight:600}
  .opt{border:1px solid #2b3240}
  .opt.good{background:rgba(34,197,94,.18);border-color:var(--ok)}
  .opt.bad{background:rgba(239,68,68,.18);border-color:var(--ko)}
  .q{font-size:16px;line-height:1.4;margin-bottom:14px}
  .meta{display:flex;justify-content:space-between;color:var(--dim);font-size:12px;margin-bottom:10px}
  .explain{font-size:13px;line-height:1.5;color:#cdd3de;background:#12151b;border-left:3px solid var(--acc);padding:10px 12px;border-radius:8px;margin-top:10px}
  .score{font-size:34px;font-weight:700;text-align:center;margin:8px 0}
  .ok{color:var(--ok)} .ko{color:var(--ko)}
  .list{font-size:13px;line-height:1.5;color:var(--dim)}
  .bar{height:6px;background:#242a35;border-radius:3px;overflow:hidden;margin-bottom:14px}
  .bar div{height:100%;background:var(--acc);width:0;transition:width .2s}
  .sign{display:flex;justify-content:center;margin:4px 0 16px}
  .sign svg{width:130px;height:130px;filter:drop-shadow(0 6px 18px rgba(0,0,0,.45))}
</style>
</head>

/* ---------- panneaux dessinés en SVG ---------- */
function svgInner(name){
  const R='#d92b2b', W='#ffffff', K='#111111', B='#1b5fb5';
  const tri = (sym, col=R) => `<svg viewBox="0 0 100 100"><polygon points="50,6 95,88 5,88" fill="${col}"/><polygon points="50,20 84,82 16,82" fill="${W}"/>${sym}</svg>`;
  const inter = (sym) => `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="${R}"/><circle cx="50" cy="50" r="34" fill="${W}"/>${sym}</svg>`;
  const obli = (sym) => `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="${B}"/>${sym}</svg>`;
  const carre = (sym) => `<svg viewBox="0 0 100 100"><rect x="8" y="8" width="84" height="84" rx="6" fill="${B}"/>${sym}</svg>`;
  const ped = `<g fill="${K}"><circle cx="52" cy="42" r="5"/><rect x="48" y="48" width="7" height="18" rx="3"/><rect x="42" y="64" width="6" height="16" rx="3" transform="rotate(14 45 72)"/><rect x="55" y="64" width="6" height="16" rx="3" transform="rotate(-12 58 72)"/></g>`;
  const cars = `<g fill="${K}"><rect x="30" y="52" width="40" height="14" rx="4"/><rect x="38" y="44" width="24" height="10" rx="4"/><circle cx="38" cy="68" r="5"/><circle cx="62" cy="68" r="5"/></g>`;
  const slide = `<g stroke="${K}" stroke-width="5" fill="none"><path d="M30 62h34l-8-8"/><path d="M30 74h40"/></g><g fill="${K}"><circle cx="66" cy="40" r="4"/></g>`;
  const num = (t, sub) => `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="${R}"/><circle cx="50" cy="50" r="34" fill="${W}"/><text x="50" y="${sub?58:64}" font-size="${sub?34:44}" font-weight="800" text-anchor="middle" fill="${K}" font-family="Arial">${t}</text></svg>`;
  switch(name){
    case 'stop': return `<svg viewBox="0 0 100 100"><polygon points="32,6 68,6 94,32 94,68 68,94 32,94 6,68 6,32" fill="${R}" stroke="#fff" stroke-width="5"/><text x="50" y="60" font-size="26" font-weight="800" text-anchor="middle" fill="#fff" font-family="Arial">STOP</text></svg>`;
    case 'cedez': return `<svg viewBox="0 0 100 100"><polygon points="50,92 95,12 5,12" fill="${R}"/><polygon points="50,76 82,22 18,22" fill="${W}"/></svg>`;
    case 'sens-interdit': return inter(`<rect x="22" y="44" width="56" height="12" fill="${R}"/>`);
    case 'danger-pieton': return tri(ped);
    case 'danger-glissant': return tri(slide);
    case 'danger-virages': return tri(`<path d="M40 80 C40 62 62 62 62 44 C62 34 52 30 46 34" stroke="${K}" stroke-width="7" fill="none" stroke-linecap="round"/>`);
    case 'danger-carrefour': return tri(`<g stroke="${K}" stroke-width="7" stroke-linecap="round"><path d="M50 78V40"/><path d="M28 56h44"/></g>`);
    case 'obligation-droite': return obli(`<path d="M50 78V34M50 34l-12 12M50 34l12 12" stroke="#fff" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`);
    case 'rond-point': return obli(`<g fill="none" stroke="#fff" stroke-width="7"><circle cx="50" cy="50" r="20"/><path d="M50 22l-9 9M50 22l9 9"/></g>`);
    case 'passage-pieton': return carre(`<polygon points="50,24 78,76 22,76" fill="#fff"/>${ped.replace(/fill="\#111111"/g,'fill="#111"')}`);
    case 'stationnement-interdit': return inter(`<text x="50" y="64" font-size="42" font-weight="800" text-anchor="middle" fill="${K}" font-family="Arial">P</text><rect x="24" y="44" width="52" height="10" fill="${R}" transform="rotate(-45 50 50)"/>`);
    case 'vitesse-50': return num('50');
    case 'vitesse-30': return num('30');
    case 'fin-interdiction': return `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="${W}" stroke="#bbb" stroke-width="3"/><circle cx="50" cy="50" r="34" fill="${W}"/></svg>`;
    case 'croisement': return tri(`<g stroke="${K}" stroke-width="6" stroke-linecap="round"><path d="M50 78V42"/><path d="M30 58h40"/></g>`);
    case 'feu': return `<svg viewBox="0 0 100 100"><rect x="32" y="8" width="36" height="84" rx="10" fill="#222"/><circle cx="50" cy="28" r="11" fill="#e11d48"/><circle cx="50" cy="50" r="11" fill="#f59e0b"/><circle cx="50" cy="72" r="11" fill="#22c55e" opacity=".35"/></svg>`;
    default: return '';
  }
}

const state = {order:[], i:0, answers:[], mode:'exam', title:''};
const app = document.getElementById('app');
const store = {
  get(){ try{ return JSON.parse(localStorage.getItem('codeErrs')||'[]'); }catch(e){ return [];} },
  add(id){ const s=this.get(); s.push(id); localStorage.setItem('codeErrs', JSON.stringify(s.slice(-200))); },
  clear(){ localStorage.removeItem('codeErrs'); }
};
function norm(q){
  if(typeof q[2]==='string' && q[2].length<20 && !q[2].includes(' ')){
    return {theme:q[0], txt:q[1], sign:q[2], opts:q[3], good:q[4], expl:q[5]};
  }
  return {theme:q[0], txt:q[1], sign:null, opts:q[2], good:q[3], expl:q[4]};
}
const shuffle = a => a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(v=>v[1]);

function home(){
  const errs = store.get();
  app.innerHTML = `
    <div class="card">
      <button class="primary" onclick="start('exam')">Examen blanc — 40 questions</button>
      <button onclick="start('quick')">Série rapide — 10 questions</button>
      <button onclick="start('signs')">Panneaux illustrés — 12 questions</button>
      <button onclick="start('errors')">Revoir mes erreurs (${errs.length})</button>
    </div>
    <div class="card">
      <div class="list"><b>Themes :</b> ${[...new Set(Q.map(q=>q[0]))].join(' · ')}</div>
    </div>
    <div class="card">
      <button onclick="if(confirm('Effacer les erreurs enregistrées ?')){store.clear();home();}">Effacer mes erreurs</button>
    </div>`;
}

function start(mode){
  let pool = (mode==='signs' ? QSIGN : Q).map((q,idx)=>({q,idx}));
  if(mode==='errors'){
    const ids = store.get();
    pool = pool.filter(o=>ids.includes(o.idx));
    if(!pool.length){ alert("Aucune erreur enregistrée pour le moment."); return; }
  }
  pool = shuffle(pool);
  if(mode==='exam') pool = shuffle(Q.map((q,idx)=>({q,idx}))).slice(0,40);
  if(mode==='signs') pool = shuffle(QSIGN.map((q,idx)=>({q,idx})));
  if(mode==='quick') pool = pool.slice(0,10);
  state.mode=mode; state.order=pool; state.i=0; state.answers=[];
  question();
}

function question(){
  const cur = state.order[state.i];
  if(!cur){ return result(); }
  const {theme,txt,opts,good,expl,sign} = norm(cur.q);
  const pct = Math.round(100*state.i/state.order.length);
  app.innerHTML = `
    <div class="bar"><div style="width:${pct}%"></div></div>
    <div class="meta"><span>Question ${state.i+1} / ${state.order.length}</span><span>${theme}</span></div>
    <div class="card">
      ${sign?`<div class="sign">${svgInner(sign)}</div>`:''}
      <div class="q">${txt}</div>
      ${opts.map((o,k)=>`<button class="opt" id="o${k}" onclick="answer(${k})">${o}</button>`).join('')}
      <div id="ex"></div>
    </div>`;
}

function answer(k){
  const cur = state.order[state.i];
  const {theme,txt,opts,good,expl,sign} = norm(cur.q);
  const ok = k===good;
  state.answers.push({idx:cur.idx, ok, theme});
  if(!ok) store.add(cur.idx);
  document.querySelectorAll('.opt').forEach(b=>b.disabled=true);
  document.getElementById('o'+good).classList.add('good');
  if(!ok) document.getElementById('o'+k).classList.add('bad');
  document.getElementById('ex').innerHTML = `<div class="explain"><b>${ok?'Bonne réponse':'Raté'}.</b> ${expl}</div>
    <button class="primary" style="margin-top:12px" onclick="next()">Suivant</button>`;
}

function next(){ state.i++; question(); }

function result(){
  const total = state.answers.length;
  const good = state.answers.filter(a=>a.ok).length;
  const passed = state.mode==='exam' ? good>=35 : good>=Math.ceil(total*0.85);
  const pct = Math.round(100*good/total);
  const weak = {};
  state.answers.filter(a=>!a.ok).forEach(a=>weak[a.theme]=(weak[a.theme]||0)+1);
  const themes = Object.entries(weak).sort((a,b)=>b[1]-a[1]).map(([t,n])=>`${t} (${n})`).join(', ') || 'aucun';
  app.innerHTML = `
    <div class="card">
      <div class="score ${passed?'ok':'ko'}">${good} / ${total}</div>
      <div class="sub" style="text-align:center">${pct}% · ${passed?'Reçu':'Pas encore'}</div>
      <div class="list" style="margin-top:12px"><b>À revoir :</b> ${themes}</div>
    </div>
    <div class="card">
      <button class="primary" onclick="start('${state.mode==='errors'?'errors':state.mode}')">Refaire</button>
      <button onclick="home()">Retour au menu</button>
    </div>`;
}

home();
</script>
</body>
</html>
